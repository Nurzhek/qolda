name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: generated code is up to date
        run: make generate-proto && git diff --exit-code -- pkg docs
      - name: gofmt
        run: test -z "$(gofmt -l internal cmd)"
      - run: go vet ./...
      - run: go test -cover ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm build-only

  reputation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reputation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: reputation/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: saved results and Go golden cases match the code
        run: |
          python experiment.py configs/fall2026.json --no-plots
          python golden.py
          git diff --exit-code -- results ../backend/internal/domain/trust/service/testdata

  image:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t qolda .
