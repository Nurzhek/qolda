syntax = "proto3";

package qolda_v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "/qolda_v1";

service UsrService {
  // public profile
  rpc Get(UsrGetReq) returns (UsrMain) {
    option (google.api.http) = {
      get: "/usr/{id}"
    };
  }

  rpc GetMe(google.protobuf.Empty) returns (UsrMain) {
    option (google.api.http) = {
      get: "/me"
    };
  }

  rpc UpdateMe(UsrUpdateMeReq) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/me"
      body: "*"
    };
  }
}

message UsrMain {
  int64 id = 1;
  google.protobuf.Timestamp created_at = 2;
  string email = 3; // only for the profile owner
  string name = 4;
  string campus = 5;
  string role = 6;
  string telegram = 7;
}

message UsrGetReq {
  int64 id = 1;
}

message UsrUpdateMeReq {
  optional string name = 1;
  optional string campus = 2;
  optional string telegram = 3;
}
